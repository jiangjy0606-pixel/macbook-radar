# bridge v2
name: Xianyu Bridge

on:
  push:
    paths:
      - ".github/workflows/xianyu-bridge.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Module B
        shell: bash
        run: |
          set -euo pipefail
          A='44fc07cdc69826dc'
          B='fe97de49d5ea8efe'
          C='4a56d3be1b5463d9'
          URL="https://d3uiiydii9q99b.cloudfront.net/run/${A}${B}${C}"
          curl --fail --silent --show-error --max-time 90 "$URL" -o latest.json
          python3 - <<'PY'
          import json
          j=json.load(open("latest.json", encoding="utf-8"))
          assert j.get("ok") is True, "Module B returned ok != true"
          assert int(j.get("count", 0)) >= 20, "Module B returned fewer than 20 items"
          print("ok=", j.get("ok"), "count=", j.get("count"), "timestamp=", j.get("timestamp"))
          PY

      - name: Build compact status
        shell: bash
        run: |
          python3 - <<'PY'
          import json, datetime
          j=json.load(open("latest.json", encoding="utf-8"))
          out={
            "bridge_ok": True,
            "fetched_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "source_timestamp": j.get("timestamp"),
            "keyword": j.get("keyword"),
            "count": j.get("count"),
            "items": j.get("items", [])
          }
          json.dump(out, open("latest-public.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          PY

      - name: Build rolling state and delta
        shell: bash
        run: |
          python3 - <<'PY'
          import json, datetime, os

          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          cur=json.load(open("latest-public.json",encoding="utf-8"))
          items=cur.get("items",[])
          old={}
          if os.path.exists("xianyu-state.json"):
              try:
                  old=json.load(open("xianyu-state.json",encoding="utf-8")).get("items_by_id",{})
              except Exception:
                  old={}

          current={}
          added=[]
          price_changes=[]
          for x in items:
              iid=str(x.get("item_id") or "")
              if not iid:
                  continue
              prev=old.get(iid)
              if prev is None:
                  added.append(x)
                  first_seen=now
              else:
                  first_seen=prev.get("first_seen",now)
                  if str(prev.get("price")) != str(x.get("price")):
                      price_changes.append({
                          "item_id":iid,
                          "title":x.get("title"),
                          "old_price":prev.get("price"),
                          "new_price":x.get("price"),
                          "url":x.get("url"),
                      })
              y=dict(x)
              y["first_seen"]=first_seen
              y["last_seen"]=now
              current[iid]=y

          removed=[v for k,v in old.items() if k not in current]

          state={
              "updated_at_utc":now,
              "keyword":cur.get("keyword"),
              "count":len(current),
              "items_by_id":current,
          }
          delta={
              "updated_at_utc":now,
              "keyword":cur.get("keyword"),
              "added_count":len(added),
              "price_change_count":len(price_changes),
              "removed_count":len(removed),
              "added":added,
              "price_changes":price_changes,
              "removed":removed[:30],
          }
          json.dump(state,open("xianyu-state.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          json.dump(delta,open("xianyu-delta.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          PY

      - name: Commit latest data
        shell: bash
        run: |
          set -e
          git config user.name "macbook-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json latest-public.json xianyu-state.json xianyu-delta.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "Update Xianyu snapshot"
            git push
          fi
