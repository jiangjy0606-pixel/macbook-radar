# bridge v2
# manual acceptance trigger: 2026-09-21
name: Xianyu Bridge

on:
  push:
    paths:
      - ".github/workflows/xianyu-bridge.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Module B
        shell: bash
        run: |
          set -euo pipefail
          A='44fc07cdc69826dc'
          B='fe97de49d5ea8efe'
          C='4a56d3be1b5463d9'
          URL="https://d3uiiydii9q99b.cloudfront.net/run/${A}${B}${C}"
          set +e
          curl --fail --silent --show-error --max-time 90 "$URL" -o /tmp/latest-new.json
          CURL_RC=$?
          set +e
          python3 - <<'PY'
          import json, os, datetime, sys
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          status={"checked_at_utc":now,"accepted":False}
          if not os.path.exists("/tmp/latest-new.json"):
              status.update({"reason":"fetch_failed"})
              json.dump(status,open("bridge-status.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
              print("Module B fetch failed; preserving previous good snapshot")
              raise SystemExit(10)
          try:
              j=json.load(open("/tmp/latest-new.json",encoding="utf-8"))
          except Exception as e:
              status.update({"reason":"invalid_json","detail":repr(e)})
              json.dump(status,open("bridge-status.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
              print("Invalid Module B JSON; preserving previous good snapshot")
              raise SystemExit(10)
          count=int(j.get("count",0) or 0)
          if j.get("ok") is not True or count < 1:
              status.update({"reason":"empty_or_not_ok","ok":j.get("ok"),"count":count,"ret":j.get("ret")})
              json.dump(status,open("bridge-status.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
              print("Module B returned no usable items; preserving previous good snapshot")
              raise SystemExit(10)
          status.update({"accepted":True,"reason":"ok","count":count,"coverage_ok":count>=20,"source_timestamp":j.get("timestamp")})
          json.dump(status,open("bridge-status.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          os.replace("/tmp/latest-new.json","latest.json")
          print("ok=",j.get("ok"),"count=",count,"coverage_ok=",count>=20,"timestamp=",j.get("timestamp"))
          PY
          RC=$?
          set -e
          if [ "$RC" = "10" ]; then
            touch /tmp/skip-build
            git config user.name "macbook-radar-bot"
            git config user.email "actions@users.noreply.github.com"
            git add bridge-status.json
            git commit -m "Record Xianyu bridge degraded check" || true
            git push || true
            exit 0
          fi
          test "$RC" = "0"

      - name: Build compact status
        shell: bash
        run: |
          if [ -f /tmp/skip-build ]; then
            echo "Preserving previous good snapshot"
            exit 0
          fi
          python3 - <<'PY'
          import json, datetime
          j=json.load(open("latest.json", encoding="utf-8"))
          out={
            "bridge_ok": True,
            "fetched_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "source_timestamp": j.get("timestamp"),
            "keyword": j.get("keyword"),
            "count": j.get("count"),
            "coverage_ok": int(j.get("count",0)) >= 20,
            "items": j.get("items", [])
          }
          json.dump(out, open("latest-public.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          PY

      - name: Build rolling state and delta
        shell: bash
        run: |
          if [ -f /tmp/skip-build ]; then
            echo "Skipping state/delta update"
            exit 0
          fi
          python3 - <<'PY'
          import json, datetime, os

          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          cur=json.load(open("latest-public.json",encoding="utf-8"))
          items=cur.get("items",[])
          old={}
          if os.path.exists("xianyu-state.json"):
              try:
                  old=json.load(open("xianyu-state.json",encoding="utf-8")).get("items_by_id",{})
              except Exception:
                  old={}

          current={}
          added=[]
          price_changes=[]
          for x in items:
              iid=str(x.get("item_id") or "")
              if not iid:
                  continue
              prev=old.get(iid)
              if prev is None:
                  added.append(x)
                  first_seen=now
              else:
                  first_seen=prev.get("first_seen",now)
                  if str(prev.get("price")) != str(x.get("price")):
                      price_changes.append({
                          "item_id":iid,
                          "title":x.get("title"),
                          "old_price":prev.get("price"),
                          "new_price":x.get("price"),
                          "url":x.get("url"),
                      })
              y=dict(x)
              y["first_seen"]=first_seen
              y["last_seen"]=now
              current[iid]=y

          removed=[v for k,v in old.items() if k not in current]

          state={
              "updated_at_utc":now,
              "keyword":cur.get("keyword"),
              "count":len(current),
              "items_by_id":current,
          }
          delta={
              "updated_at_utc":now,
              "keyword":cur.get("keyword"),
              "added_count":len(added),
              "price_change_count":len(price_changes),
              "removed_count":len(removed),
              "added":added,
              "price_changes":price_changes,
              "removed":removed[:30],
          }
          json.dump(state,open("xianyu-state.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          json.dump(delta,open("xianyu-delta.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          PY

      - name: Commit latest data
        shell: bash
        run: |
          if [ -f /tmp/skip-build ]; then
            echo "Degraded status already committed; keeping previous good snapshot"
            exit 0
          fi
          set -e
          git config user.name "macbook-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json latest-public.json xianyu-state.json xianyu-delta.json bridge-status.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "Update Xianyu snapshot"
            git push
          fi
