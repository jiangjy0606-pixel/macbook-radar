name: Xianyu Watch Request

on:
  push:
    paths:
      - "requests/*.json"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request file
        shell: bash
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          SHA='${{ github.sha }}'
          FILE="$(git diff --name-only "$BEFORE" "$SHA" -- 'requests/*.json' | tail -n 1)"
          if [ -z "$FILE" ]; then
            FILE="$(git show --pretty='' --name-only "$SHA" -- 'requests/*.json' | tail -n 1)"
          fi
          test -n "$FILE"
          echo "$FILE" > /tmp/request_file.txt
          basename "$FILE" .json > /tmp/request_id.txt
          python3 - <<'PY'
          import json, base64
          f=open('/tmp/request_file.txt',encoding='utf-8').read().strip()
          j=json.load(open(f,encoding='utf-8'))
          q=str(j.get('keyword','')).strip()
          if not q:
              raise SystemExit('keyword is empty')
          q64=base64.urlsafe_b64encode(q.encode('utf-8')).decode('ascii').rstrip('=')
          open('/tmp/query.txt','w',encoding='utf-8').write(q)
          open('/tmp/query64.txt','w',encoding='ascii').write(q64)
          print('request_file=',f,'keyword=',q)
          PY

      - name: Fetch Module B
        shell: bash
        run: |
          set -euo pipefail
          A='44fc07cdc69826dc'
          B='fe97de49d5ea8efe'
          C='4a56d3be1b5463d9'
          Q64="$(cat /tmp/query64.txt)"
          URL="https://d3uiiydii9q99b.cloudfront.net/search64/${A}${B}${C}/${Q64}"
          curl --fail --silent --show-error --max-time 90 "$URL" -o /tmp/result.json
          python3 - <<'PY'
          import json
          want=open('/tmp/query.txt',encoding='utf-8').read()
          j=json.load(open('/tmp/result.json',encoding='utf-8'))
          assert j.get('ok') is True, 'Module B returned ok != true'
          assert str(j.get('keyword','')).strip() == want, 'keyword mismatch'
          assert int(j.get('count',0)) >= 1, 'no items'
          PY

      - name: Save per-watch result
        shell: bash
        run: |
          set -euo pipefail
          ID="$(cat /tmp/request_id.txt)"
          mkdir -p results
          cp /tmp/result.json "results/$ID.json"
          git config user.name "xianyu-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "results/$ID.json"
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "Update Xianyu watch result: $ID"
            git push
          fi
